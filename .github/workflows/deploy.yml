name: CI/CD Deploy E-Care

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $(uname -a || hostname)"
          docker --version || true
          docker compose version || true

      - name: Create backend env file
        run: |
          echo "PORT=3000" > backend/.env
          echo "NODE_ENV=production" >> backend/.env
          echo "FRONTEND_URL=https://zszonetechnology.top" >> backend/.env
          echo "JWT_SECRET=ecare_jwt_secret_key_2024_change_in_production" >> backend/.env
          echo "JWT_EXPIRES_IN=7d" >> backend/.env
          echo "DB_HOST=host.docker.internal" >> backend/.env
          echo "DB_USER=root" >> backend/.env
          echo "DB_PASSWORD=" >> backend/.env
          echo "DB_NAME=ecare_db" >> backend/.env
          echo "DB_PORT=3306" >> backend/.env
          echo "SUPABASE_URL=https://srshalxtikpylcfztlmz.supabase.co" >> backend/.env
          echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyc2hhbHh0aWtweWxjZnp0bG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NDk4NDAsImV4cCI6MjA4NTQyNTg0MH0.15yIT0pGWgT5UloRyDSVSA88L0mnIJKBom0L1pw9CGw" >> backend/.env
          echo "SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyc2hhbHh0aWtweWxjZnp0bG16Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2OTg0OTg0MCwiZXhwIjoyMDg1NDI1ODQwfQ.Mw4wTRl8qMDLXMXClfPqbH2WbfTH4m5eGnGtK0cXXWU" >> backend/.env
          echo "backend/.env created"

      - name: Stop all containers and cleanup
        run: |
          docker compose down --remove-orphans || true
          docker ps -aq | xargs -r docker rm -f || true

      - name: Build and start containers
        run: docker compose up -d --build --force-recreate

      - name: Verify deployment
        run: |
          echo "Waiting for services to start..."
          sleep 15
          curl -sf http://localhost:3000/api/health || echo "Backend health check failed"
          curl -sf http://localhost/ || echo "Frontend check failed"
          echo "Deployment verification done"