name: CI/CD Deploy E-Care to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. BUILD FRONTEND
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: "https://api.ptas.my/api"
          VITE_GOOGLE_CLIENT_ID: "385770142030-f7hgo133gh1rgr89ml4770fllp1hrrl4.apps.googleusercontent.com"
        run: npm run build

      # 2. BUILD BACKEND
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend (TypeScript)
        working-directory: ./backend
        run: npm run build

      # 3. PREPARE BACKEND FILES FOR FTP
      # Copy package.json to dist so we can upload it easily along with compiled code
      - name: Prepare Backend Dist
        run: |
          cp backend/package.json backend/dist/
          cp backend/package-lock.json backend/dist/
          
      # 4. UPLOAD FRONTEND VIA FTP
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          # UBAH INI KEPADA FOLDER SEBENAR DI HOSTINGER (Contoh: ./domains/ecare.ptas.my/public_html/)
          server-dir: ./domains/ptas.my/public_html/
          
      # 5. UPLOAD BACKEND VIA FTP
      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/dist/
          # UBAH INI KEPADA FOLDER SEBENAR DI HOSTINGER (Berdasarkan ftp_script.txt anda)
          server-dir: ./domains/api.ptas.my/nodejs/
          exclude: |
            **/.env
            **/node_modules/**
            **/uploads/**
            uploads/**
          
      # 6. TRIGGER HOSTINGER NODE.JS RESTART
      - name: Create Restart File
        run: |
          mkdir -p tmp
          echo "Restarting server at $(date)" > tmp/restart.txt
          
      - name: Deploy Restart File via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./tmp/
          server-dir: ./domains/api.ptas.my/nodejs/tmp/
