name: CI/CD Deploy E-Care

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $(uname -a || hostname)"
          docker --version || true
          docker compose version || true

      - name: Create backend env file
        run: |
          echo "PORT=${{ secrets.DB_PORT || '3000' }}" > backend/.env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" >> backend/.env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> backend/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> backend/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> backend/.env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> backend/.env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> backend/.env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> backend/.env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> backend/.env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> backend/.env
          echo "backend/.env created"

      - name: Stop existing containers
        run: docker compose down || true

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Verify deployment
        run: |
          echo "Waiting for services to start..."
          sleep 15
          curl -sf http://localhost:3000/api/health || echo "Backend health check failed"
          curl -sf http://localhost/ || echo "Frontend check failed"
          echo "Deployment verification done"